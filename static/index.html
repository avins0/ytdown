<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ytdown</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Application header">
        <div>
          <p class="eyebrow">Local YouTube and YouTube Music downloader</p>
          <h1>ytdown</h1>
        </div>
        <div class="top-actions">
          <div class="health" id="health">
            <span class="health-dot" aria-hidden="true"></span>
            <span>Checking tools</span>
          </div>
          <button class="shutdown" id="shutdown" type="button" title="Shutdown server" aria-label="Shutdown server">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2v10M6.3 6.8a8 8 0 1 0 11.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section class="workspace">
        <form class="download-panel" id="download-form">
          <label class="field">
            <span>YouTube or YouTube Music link</span>
            <input
              id="url"
              name="url"
              type="url"
              placeholder="https://music.youtube.com/watch?v=..."
              autocomplete="off"
              required
            >
          </label>

          <div class="control-row">
            <fieldset class="segmented" aria-label="Format">
              <legend>Format</legend>
              <label>
                <input type="radio" name="mediaType" value="mp4" checked>
                <span>MP4</span>
              </label>
              <label>
                <input type="radio" name="mediaType" value="mp3">
                <span>MP3</span>
              </label>
            </fieldset>

            <label class="toggle">
              <input id="playlist" name="playlist" type="checkbox">
              <span class="toggle-track" aria-hidden="true"></span>
              <span>Playlist</span>
            </label>
          </div>

          <label class="field">
            <span>Output folder</span>
            <input id="output-dir" name="outputDir" type="text" autocomplete="off">
          </label>

          <div class="notice">
            Only download videos or audio that you own, created, or have permission to save.
          </div>

          <button class="primary" type="submit">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Start Download</span>
          </button>
        </form>

        <section class="jobs-panel" aria-label="Downloads">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Queue</p>
              <h2>Downloads</h2>
            </div>
            <button class="ghost" id="refresh" type="button" title="Refresh">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M21 12a9 9 0 0 1-15.6 6.1M3 12A9 9 0 0 1 18.6 5.9M18 2v4h-4M6 22v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="jobs" id="jobs">
            <div class="empty">
              <h3>No downloads yet</h3>
              <p>Paste a YouTube or YouTube Music link to start a job.</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <template id="job-template">
      <article class="job">
        <div class="job-topline">
          <div>
            <p class="job-title"></p>
            <p class="job-meta"></p>
          </div>
          <span class="status-pill"></span>
        </div>
        <div class="progress-shell">
          <div class="progress-bar"></div>
        </div>
        <div class="job-stats">
          <span class="job-message"></span>
          <span class="job-speed"></span>
          <span class="job-eta"></span>
        </div>
        <details class="job-log">
          <summary>Log</summary>
          <pre></pre>
        </details>
        <div class="job-actions">
          <button class="ghost danger cancel-job" type="button">Cancel</button>
        </div>
      </article>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
